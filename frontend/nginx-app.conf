# Arayüz + ters vekil kuralları. HTTP ve HTTPS server blokları bunu
# `include` eder; kural iki yerde kopyalanmasın diye ayrı dosyada.

root /usr/share/nginx/html;

# Güvenlik başlıkları: sayfanın başka bir sitede çerçeve içine alınmasını
# (clickjacking) ve tarayıcının dosya türünü tahmin etmesini engeller.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# /api/... -> Python :8000 ("/api" öneki kesilir: sondaki "/" bunu yapar)
location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;   # SHAP açıklaması birkaç saniye sürebilir
}

# /maint/... -> .NET :5080
location /maint/ {
    proxy_pass http://maintenance:5080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Tek sayfa uygulama: bilinmeyen yol index.html'e düşer.
location / {
    try_files $uri $uri/ /index.html;
}

# Derlenmiş varlıkların adında içerik özeti var: uzun süre önbelleğe alınabilir.
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
