# TLS sonlandırma. Şifreleme tarayıcı ile nginx arasında yapılır; nginx
# arka uç servislerle küme içi ağda düz HTTP konuşur ("TLS termination at
# the edge") — bu servisler dışarıya port açmıyor.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/dev-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-key.pem;

    # Yalnızca güncel sürümler; TLS 1.0/1.1 kapalı.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # HSTS yok: kendinden imzalı sertifikayla tarayıcıyı bu adrese kalıcı
    # olarak kilitlemek, demo kapandıktan sonra localhost'u kullanılamaz
    # hâle getirirdi. Gerçek sertifikayla açılmalı.

    include /etc/nginx/nginx-app.conf;
}
