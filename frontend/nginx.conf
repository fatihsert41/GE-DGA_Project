# Arayüz + ters vekil. Tarayıcı üç servisi TEK adresten görür (CORS yok),
# tıpkı geliştirmedeki Vite vekili gibi (vite.config.js ile aynı kurallar).
#
# TLS (16 Eyl): sertifika BAĞLANMIŞSA (./certs -> /etc/nginx/certs)
# `docker-entrypoint.sh` 443 dinleyen ikinci bloğu (nginx-tls.conf) devreye
# alır ve bu blok isteği https'e yönlendirir. Sertifika yoksa her şey
# eskisi gibi düz HTTP çalışır — demo, sertifika dosyasına bağımlı değil.

server {
    listen 80;
    server_name _;

    include /etc/nginx/nginx-app.conf;
}
