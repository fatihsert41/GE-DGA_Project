# Arayüz + ters vekil. Tarayıcı üç servisi TEK adresten görür (CORS yok),
# tıpkı geliştirmedeki Vite vekili gibi (vite.config.js ile aynı kurallar).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Güvenlik başlıkları: sayfanın başka bir sitede çerçeve içine alınmasını
    # (clickjacking) ve tarayıcının dosya türünü tahmin etmesini engeller.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # /api/... -> Python :8000 ("/api" öneki kesilir: sondaki "/" bunu yapar)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # SHAP açıklaması birkaç saniye sürebilir
    }

    # /maint/... -> .NET :5080
    location /maint/ {
        proxy_pass http://maintenance:5080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tek sayfa uygulama: bilinmeyen yol index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Derlenmiş varlıkların adında içerik özeti var: uzun süre önbelleğe alınabilir.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
