# TransformerAI — Sürekli Entegrasyon (Zayıf yanlar 3/4)
#
# Her push ve pull request'te üç iş PARALEL çalışır:
#   python   — modeli eğitir, 300+ Python testini koşar
#   dotnet   — 225+ .NET testini koşar (HTTP entegrasyon testleri dahil)
#   frontend — arayüzü üretim için derler (JSX/import hatası yakalanır)
#
# Neden? Şimdiye kadar testler yalnızca kod yazan kişinin bilgisayarında
# çalışıyordu. İki bilgisayarlı çalışmada "bende geçiyordu" cümlesinin bir
# kanıtı yoktu. CI, depodaki HER sürümün temiz bir makinede geçtiğini gösterir.
#
# Testler Linux'ta çalışır: Windows'a özgü bir varsayım (yol ayırıcı, kültür,
# dosya kilidi) varsa burada ortaya çıkar.

name: CI

on:
  push:
  pull_request:

# Aynı dala art arda push edilince eski çalıştırmayı iptal et: yalnızca son
# sürümün sonucu önemli, eski turlar kuyrukta boşuna yer tutmasın.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ML + API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      # model.joblib git'e girmez (.gitignore). Tahmin katmanını kullanan
      # testler için eğitilmiş model gerekir. --field-like ŞART: üretim
      # modeli bu profille eğitiliyor (Faz 6.8), yoksa testler farklı bir
      # modeli sınamış olur.
      - name: Modeli eğit
        run: python -m app.ml.train --field-like

      - name: Testler
        run: python -m pytest -q

  dotnet:
    name: .NET (Bakım servisi)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testler
        working-directory: maintenance
        run: dotnet test --configuration Release

  frontend:
    name: Arayüz (derleme)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: package-lock.json'a BİREBİR uyar; npm install gibi kilidi
      # sessizce güncellemez. CI'da tekrarlanabilirlik için doğrusu bu.
      - run: npm ci
      - run: npm run build
